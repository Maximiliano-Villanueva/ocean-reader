server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API is served by Traefik (same-origin /api through the edge). Do not proxy here.

    # SPA shell must not be cached — stale index.html keeps old hashed JS bundles alive.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Stable PDF.js worker (copied at build). Correct MIME required for ES module import.
    location = /pdf.worker.min.mjs {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Older builds referenced Vite-hashed workers under /assets/; redirect so cached bundles still work.
    location ~ ^/assets/pdf\.worker\.min-.+\.mjs$ {
        default_type application/javascript;
        absolute_redirect off;
        return 302 /pdf.worker.min.mjs;
    }

    # Other .mjs assets (if any).
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
