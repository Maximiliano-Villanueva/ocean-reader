[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-read-schema-agent"
version = "0.1.0"
description = "Schema authoring agent for Ocean Read (Ollama gemma4:e4b)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schema_agent = ["capabilities_manifest.json"]
